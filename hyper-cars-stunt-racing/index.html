<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Hyper Cars Stunt Racing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        html,
        body {
            background-image: url("TemplateData/Game/background.jpg"), url("Build/Build.jpg"); /* oyuna ozel arka plan, yoksa eski */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
        }

        div#gameContainer {
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        div#gameContainer canvas {
            position: absolute;
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        div#gameContainer canvas[data-pixel-art="true"] {
            position: absolute;
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .loading-stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vh, 20px);
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.25s ease-out; /* v91: 0.6s -> 0.25s */
            padding: 24px;
            box-sizing: border-box;
        }

        .loading-logo {
            width: clamp(120px, 17vw, 200px);
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.55))
                    drop-shadow(0 0 40px rgba(120, 200, 255, 0.18));
        }

        .loading-track {
            width: clamp(260px, 34vw, 440px);   /* v72: buyutuldu (eski: 200px/26vw/320px) */
            height: 16px;                       /* v72: eski 10px */
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.14);
            overflow: hidden;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08),
                        inset 0 1px 3px rgba(0, 0, 0, 0.55);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg,
                        #00d4ff 0%, #7a5cff 50%, #ff4ecb 100%);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.55),
                        0 0 24px rgba(255, 78, 203, 0.28);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent,
                        rgba(255, 255, 255, 0.55), transparent);
            animation: loadingShimmer 1.8s ease-in-out infinite;
            border-radius: inherit;
        }

        .loading-label {
            font-family: 'Poppins', system-ui, sans-serif;
            font-size: 13px;                    /* v72: eski 11px */
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
            margin: 0;
        }

        /* v84: cubuk tam merkez */
        /* Eskiden logo+cubuk+yazi grup olarak ortalaniyordu -> cubuk ortanin altinda kaliyordu.
           Artik CUBUK ekranin tam merkezinde; logo ustune, yazi altina hizalanir. */
        .loading-stage { display: block; }
        .loading-stage .loading-track {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); margin: 0;
        }
        .loading-stage .loading-logo {
            position: absolute; left: 0; right: 0; margin: 0 auto; bottom: calc(50% + 8px + clamp(14px, 2.4vh, 26px));
        }
        .loading-stage .loading-label {
            position: absolute; left: 50%; top: calc(50% + 8px + 6px);
            transform: translateX(-50%); white-space: nowrap;
        }

        /* v86: cubugun ucunda ilerleyen ok (skin 10: A mor dis govde + B kirmizi ic). Beyaz sprite renk katmani ile boyanir. */
        .loading-stage .loading-arrow {
            --p: 0;
            position: absolute; top: 50%; width: 46px; height: 46px; pointer-events: none;
            left: calc(50% + (var(--p) - 0.5) * clamp(260px, 34vw, 440px));
            transform: translate(-50%, -50%) rotate(90deg);
            filter: drop-shadow(0 0 8px rgba(95, 212, 255, 0.7));
            transition: left 0.25s ease-out;
        }
        .loading-arrow .la-layer { position: absolute; inset: 0; isolation: isolate;
            -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .loading-arrow .la-layer img { width: 100%; height: 100%; display: block; mix-blend-mode: multiply; }
        .loading-arrow .la-a { background: #5fd4ff; -webkit-mask-image: url(TemplateData/loading_arrow_a.png); mask-image: url(TemplateData/loading_arrow_a.png); }
        .loading-arrow .la-b { background: #8a3cff; -webkit-mask-image: url(TemplateData/loading_arrow_b.png); mask-image: url(TemplateData/loading_arrow_b.png); }
        @keyframes arrowBob {
            0%, 100% { transform: translate(-50%, -50%) rotate(90deg); }
            50%      { transform: translate(-50%, -58%) rotate(90deg); }
        }

        /* Yukleme arabasi (istege bagli): TemplateData/Game/body.png varsa ok yerine cubugun ustunde ilerleyen araba
           (tekerler doner, arkadan duman). Arabaya ozel olculer TemplateData/Game/car.css'te (--lc-*). */
        .loading-car { display: none; }
        .loading-stage { --lc-width: clamp(64px, 6.5vw, 96px); --lc-track: clamp(260px, 34vw, 440px); }
        .loading-stage.has-car .loading-arrow { display: none; }
        /* logo arabanin ustunde kalsin (araba cubugun ortasindan gecerken altina girmesin) */
        .loading-stage.has-car .loading-logo {
            bottom: calc(50% + 4px + var(--lc-width, clamp(64px, 6.5vw, 96px)) / var(--lc-aspect, 3.76) + clamp(8px, 1.6vh, 14px));
        }
        /* araba modunda cubuk = yol: asfalt, kenar cizgileri, kesik orta cizgi; gidilen kisimda cizgi sari */
        .loading-stage.has-car .loading-track {
            height: 12px;
            border-radius: 2px;
            border: none;
            background:
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.55) 0 10px, transparent 10px 22px) center / 100% 2px no-repeat,
                linear-gradient(180deg, #3b3e46 0%, #2a2c32 45%, #222429 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(255, 255, 255, 0.18),
                        0 3px 10px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }
        .loading-stage.has-car .progress-bar {
            border-radius: 0;
            transition: none; /* her karede araba suruyor */
            background:
                repeating-linear-gradient(90deg, #ffc23a 0 10px, transparent 10px 22px) center / 100% 2px no-repeat,
                linear-gradient(180deg, #474b55 0%, #33363d 45%, #2a2c32 100%);
            box-shadow: inset 0 1px 0 rgba(255, 210, 120, 0.55);
        }
        .loading-stage.has-car .progress-bar::after { display: none; }
        .loading-stage.has-car .loading-car {
            --p: 0;
            display: block;
            position: absolute;
            top: calc(50% - 4px); /* lastikler yol yuzeyine basar */
            width: var(--lc-width, clamp(64px, 6.5vw, 96px));
            aspect-ratio: var(--lc-aspect, 3.76);
            /* %0: arka yolun basinda, %100: burun yolun sonunda (araba hep yolun ustunde); lastik alti yol yuzeyinde */
            left: calc(50% - var(--lc-track) / 2 + var(--p) * (var(--lc-track) - var(--lc-width)));
            transform: translateY(calc(-1 * var(--lc-ground, 96%)));
            pointer-events: none;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
            z-index: 2; /* duman arkada */
        }
        .loading-car .lc-body { position: absolute; inset: 0; width: 100%; height: 100%; animation: carBounce 0.45s ease-in-out infinite; }
        .loading-car .lc-wheel {
            position: absolute;
            transform: translate(-50%, -50%); /* donus JS'te: gidilen yola gore yuvarlanir */
        }
        .loading-car .lc-wheel-front { left: var(--lc-front-x, 77.5%); top: var(--lc-front-y, 67.9%); width: var(--lc-front-d, 15%); }
        .loading-car .lc-wheel-rear { left: var(--lc-rear-x, 19.6%); top: var(--lc-rear-y, 67.2%); width: var(--lc-rear-d, 14.5%); }
        /* lastik dumani: parcacik canvas'i (arabanin arkasinda) */
        .loading-smoke-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        @keyframes carBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5%); } }

        .loading-stage.is-hidden {
            opacity: 0;
        }

        @keyframes loadingFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @keyframes loadingShimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(90deg, rgba(14, 176, 240, 1) 0%, rgba(87, 199, 133, 1) 97%);
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            font-weight: 600;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: orientationPulse 2s ease-in-out infinite;
            max-width: 90vw;
            max-height: 90vh;
            min-width: 300px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #orientation-warning.show {
            display: flex;
        }

        @keyframes orientationPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
        }

        @keyframes rotateImage {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        #orientation-image {
            width: 80px;
            height: 80px;
            display: block;
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            animation: rotateImage 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .orientation-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            flex-shrink: 0;
        }

        /* RTL support for Arabic */
        .orientation-text[dir="rtl"] {
            direction: rtl;
            text-align: center;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 480px) {
            #orientation-warning {
                padding: 30px 25px;
                font-size: 16px;
                min-width: 280px;
                gap: 15px;
            }
            
            #orientation-image {
                width: 60px;
                height: 60px;
            }
            
            .orientation-text {
                font-size: 14px;
            }
        }

        @media (max-height: 500px) {
            #orientation-warning {
                padding: 20px 30px;
                gap: 10px;
            }
            
            #orientation-image {
                width: 50px;
                height: 50px;
            }
            
            .orientation-text {
                font-size: 14px;
            }
        }
    </style>

</head>

<body>
    <div id="orientation-warning">
        <img id="orientation-image" src="TemplateData/Orientation/orientation.png" alt="Orientation">
        <div class="orientation-text">Please rotate your device to the correct mode.</div>
    </div>
    <div id="gameContainer">
        <div class="loading-stage" id="loading-panel">
            <img src="TemplateData/logo.png" class="loading-logo" alt="">
            <div class="loading-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="loading-arrow" id="loading-arrow"><div class="la-layer la-a"><img src="TemplateData/loading_arrow_a.png" alt=""></div><div class="la-layer la-b"><img src="TemplateData/loading_arrow_b.png" alt=""></div></div>
            <div class="loading-car" id="loading-car"><img class="lc-body" src="TemplateData/Game/body.png" alt=""><img class="lc-wheel lc-wheel-rear" src="TemplateData/Game/wheel_rear.png" alt=""><img class="lc-wheel lc-wheel-front" src="TemplateData/Game/wheel_front.png" alt=""></div>
            <span class="loading-label" id="loading-percent">LOADING 0%</span>
        </div>
        <script>
            // Yukleme arabasi: TemplateData/Game/body.png yuklenirse ok yerine araba (yoksa ok kalir).
            // Hareket: Unity ilerlemesi sicramali gelir; araba hedefe sabit en yuksek hizla yumusakca yaklasir, yol cubugu ve
            // yuzde arabayla birlikte ilerler. Tekerler gidilen mesafeye gore yuvarlanir (durunca durur), duman hizla orantili.
            // Lastik dumani: canvas parcacik sistemi (TemplateData/Game/smoke.png dokusu). Parcaciklar arka tekerin yere
            // degdigi noktadan (--lc-smoke-x / -y, arabaya gore %) cikar; geriye savrulur, surtunmeyle yavaslar, yukselir,
            // buyur, doner ve yavasca soner. Duman sahnede kalir: araba ilerledikce arkasinda iz birakir.
            (function () {
                var stage = document.getElementById('loading-panel');
                var car = document.getElementById('loading-car');
                if (!stage || !car) return;
                var canvas = null, ctx = null, tex = new Image(), parts = [], emitting = false, last = 0, carry = 0;
                var target = 0, shown = 0, speed = 0, angle = 0, finishCb = null, finishAt = 0, active = false;
                var bar = document.getElementById('progress-bar'), label = document.getElementById('loading-percent');
                var track = stage.querySelector('.loading-track');
                var wheels = car.querySelectorAll('.lc-wheel');
                var MAX_SPEED = 0.22, FINISH_SPEED = 2.2;   // ilerleme / sn
                window.loadingCarSet = function (p) { if (p > target) target = p; return active; };
                window.loadingCarFinish = function (cb) {
                    if (!active) { cb(); return; }
                    target = 1; finishCb = cb; finishAt = performance.now();
                };
                var probe = new Image();
                probe.onload = function () {
                    stage.classList.add('has-car');
                    active = true;
                    canvas = document.createElement('canvas');
                    canvas.className = 'loading-smoke-canvas';
                    stage.insertBefore(canvas, car);
                    ctx = canvas.getContext('2d');
                    tex.src = 'TemplateData/Game/smoke.png';
                    emitting = true;
                    requestAnimationFrame(frame);
                };
                probe.src = 'TemplateData/Game/body.png';

                function resize() {
                    var dpr = Math.min(window.devicePixelRatio || 1, 2);
                    var w = Math.round(stage.clientWidth * dpr), h = Math.round(stage.clientHeight * dpr);
                    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
                    return dpr;
                }

                function emit(n, dpr) {
                    var r = car.getBoundingClientRect(), s = stage.getBoundingClientRect();
                    var cs = getComputedStyle(car);
                    var sx = parseFloat(cs.getPropertyValue('--lc-smoke-x')) || 20;
                    var sy = parseFloat(cs.getPropertyValue('--lc-smoke-y')) || 93;
                    var x0 = (r.left - s.left + r.width * sx / 100) * dpr, y0 = (r.top - s.top + r.height * sy / 100) * dpr;
                    var k = r.height * dpr; // olcek: araba yuksekligi
                    for (var i = 0; i < n; i++) {
                        parts.push({
                            x: x0 + (Math.random() - 0.5) * k * 0.25, y: y0 - Math.random() * k * 0.08,
                            vx: -k * (1.2 + Math.random() * 1.6), vy: -k * (0.1 + Math.random() * 0.45),
                            s0: k * (0.18 + Math.random() * 0.12), s1: k * (1.1 + Math.random() * 0.9),
                            rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 1.6,
                            age: 0, life: 1.3 + Math.random() * 0.9, a: 0.45 + Math.random() * 0.25
                        });
                    }
                }

                function frame(t) {
                    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0.016;
                    last = t;
                    if (stage.style.display === 'none') { parts.length = 0; return; }
                    var dpr = resize();
                    // ilerleme: hedefe yumusak yaklasma (bitiste hizli), cubuk + yuzde + araba ayni degerden
                    var prev = shown;
                    var limit = (finishCb ? FINISH_SPEED : MAX_SPEED) * dt;
                    shown += Math.max(0, Math.min(limit, (target - shown) * Math.min(1, dt * 3) + limit * 0.15));
                    if (shown > target) shown = target;
                    var moved = shown - prev;
                    speed = speed * 0.85 + (moved / Math.max(dt, 0.001)) * 0.15;
                    car.style.setProperty('--p', shown);
                    // sari (gidilmis) cizgi arabanin altina kadar
                    if (bar && track) {
                        var cr = car.getBoundingClientRect(), tr = track.getBoundingClientRect();
                        bar.style.width = Math.max(0, Math.min(100, (cr.left + cr.width * 0.45 - tr.left) / tr.width * 100)) + '%';
                    }
                    if (label) label.textContent = 'LOADING ' + Math.round(shown * 100) + '%';
                    // tekerler: yuvarlanma (gidilen piksel / teker yaricapi)
                    var trackW = track ? track.getBoundingClientRect().width : 400;
                    for (var w = 0; w < wheels.length; w++) {
                        var radius = Math.max(1, wheels[w].getBoundingClientRect().width / 2);
                        if (w === 0) angle += moved * trackW / radius;
                        wheels[w].style.transform = 'translate(-50%, -50%) rotate(' + angle + 'rad)';
                    }
                    if (finishCb && (shown >= 0.999 || performance.now() - finishAt > 700)) {
                        var cb = finishCb; finishCb = null; emitting = false; cb();
                    }
                    if (emitting) {
                        // duman hizla orantili (dururken neredeyse yok)
                        carry += dt * (4 + Math.min(1, speed / MAX_SPEED) * 55);
                        var n = Math.floor(carry); carry -= n;
                        if (n > 0) emit(n, dpr);
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (var i = parts.length - 1; i >= 0; i--) {
                        var p = parts[i];
                        p.age += dt;
                        if (p.age >= p.life) { parts.splice(i, 1); continue; }
                        var u = p.age / p.life;
                        var drag = Math.pow(0.12, dt);          // hizla yavaslar (savrulma)
                        p.vx *= drag; p.vy = p.vy * drag - p.s1 * 0.12 * dt; // sicak duman hafif yukselir
                        p.x += p.vx * dt; p.y += p.vy * dt;
                        p.rot += p.vr * dt;
                        var size = p.s0 + (p.s1 - p.s0) * (1 - Math.pow(1 - u, 2.2));
                        var alpha = p.a * Math.min(1, u * 8) * Math.pow(1 - u, 1.6);
                        if (!tex.complete || !tex.naturalWidth) continue;
                        ctx.globalAlpha = alpha;
                        ctx.setTransform(1, 0, 0, 1, p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.drawImage(tex, -size / 2, -size / 2, size, size);
                    }
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalAlpha = 1;
                    if (emitting || parts.length) requestAnimationFrame(frame);
                }

            })();
        </script>

        <script>
            // Multi-language support for orientation messages
            var orientationMessages = {
                'tr': {
                    portrait: 'Lütfen cihazınızı dikey konuma çevirin.',
                    landscape: 'Lütfen cihazınızı yatay konuma çevirin.'
                },
                'en': {
                    portrait: 'Please rotate your device to portrait mode.',
                    landscape: 'Please rotate your device to landscape mode.'
                },
                'ar': {
                    portrait: 'يرجى تدوير جهازك إلى الوضع الرأسي.',
                    landscape: 'يرجى تدوير جهازك إلى الوضع الأفقي.'
                },
                'de': {
                    portrait: 'Bitte drehen Sie Ihr Gerät in den Hochformat-Modus.',
                    landscape: 'Bitte drehen Sie Ihr Gerät in den Querformat-Modus.'
                },
                'pt': {
                    portrait: 'Por favor, gire seu dispositivo para o modo retrato.',
                    landscape: 'Por favor, gire seu dispositivo para o modo paisagem.'
                },
                'ru': {
                    portrait: 'Пожалуйста, поверните устройство в портретный режим.',
                    landscape: 'Пожалуйста, поверните устройство в альбомный режим.'
                },
                'es': {
                    portrait: 'Por favor, gira tu dispositivo al modo vertical.',
                    landscape: 'Por favor, gira tu dispositivo al modo horizontal.'
                },
                'fr': {
                    portrait: 'Veuillez faire pivoter votre appareil en mode portrait.',
                    landscape: 'Veuillez faire pivoter votre appareil en mode paysage.'
                }
            };

            // Get browser language
            function getBrowserLanguage() {
                var lang = navigator.language || navigator.userLanguage;
                var langCode = lang.substring(0, 2).toLowerCase();
                
                // Check if language is supported, default to English
                return orientationMessages[langCode] ? langCode : 'en';
            }

            // Get localized message
            function getOrientationMessage(requiredOrientation, isCurrentlyPortrait) {
                var lang = getBrowserLanguage();
                var messages = orientationMessages[lang];
                var normalizedRequired = requiredOrientation.toLowerCase();
                
                if (normalizedRequired === "portrait" && !isCurrentlyPortrait) {
                    // Need to rotate to Portrait
                    return messages.portrait;
                } else if (normalizedRequired === "landscape" && isCurrentlyPortrait) {
                    // Need to rotate to Landscape
                    return messages.landscape;
                }
                return '';
            }

            var canvas = document.querySelector("#unity-canvas");
            var progressBar = document.querySelector("#progress-bar");
            var gameContainer = document.querySelector("#gameContainer");
            var orientationWarning = document.querySelector("#orientation-warning");
            var config = {
                dataUrl: "Build/HyperCarsStuntRacingV4.data.unityweb",
                frameworkUrl: "Build/HyperCarsStuntRacingV4.framework.js.unityweb",
                codeUrl: "Build/HyperCarsStuntRacingV4.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "gameVgames",
                productName: "Hyper Cars Stunt Racing",
                productVersion: "1.1",
                matchWebGLToCanvasSize: false,
            };
            var scaleToFit;
            try {
                scaleToFit = true; // sabit: custom template tag bos projede tanimli olmuyor
            } catch (e) {
                scaleToFit = true;
            }

            function progressHandler(progress) {
                var percent = Math.round(progress * 100);
                var bar = document.querySelector("#progress-bar");
                var label = document.querySelector("#loading-percent");
                var panel = document.querySelector("#loading-panel");

                // yukleme arabasi varsa cubugu / yuzdeyi araba yumusakca surer (Unity ilerlemesi sicramali gelir)
                var carDrives = window.loadingCarSet ? window.loadingCarSet(progress) : false;
                if (!carDrives) {
                    if (bar) bar.style.width = percent + '%';
                    if (label) label.textContent = 'LOADING ' + percent + '%';
                }
                var arrow = document.querySelector("#loading-arrow");
                if (arrow) arrow.style.setProperty('--p', progress);

                if (progress >= 1) {
                    // v91: logo gec kayboluyordu (400ms bekleme + 0.6s fade) -> hemen ve hizli kapat
                    var hide = function () {
                        if (panel) panel.classList.add('is-hidden');
                        setTimeout(function () {
                            if (panel) panel.style.display = 'none';
                        }, 300);
                    };
                    // araba once yolun sonuna varsin (en fazla ~0.7 sn)
                    if (window.loadingCarFinish) window.loadingCarFinish(hide); else hide();
                }
            }

            function onResize() {
                var container = canvas.parentElement;
                container.style.width  = window.innerWidth  + "px";
                container.style.height = window.innerHeight + "px";
                container.style.top    = "0px";
                container.style.left   = "0px";
            }

           function checkOrientation(requiredOrientation) {
                if (!requiredOrientation) {
                    console.log('No required orientation specified, hiding warning');
                    orientationWarning.classList.remove('show');
                    gameContainer.style.display = 'block';
                    return;
                }
                
                var orientationText = document.querySelector('.orientation-text');
                var isCurrentlyPortrait = window.innerHeight > window.innerWidth;
                var currentLang = getBrowserLanguage();
                
                // Normalize orientation string (case insensitive)
                var normalizedRequired = requiredOrientation.toLowerCase();
                
                // Debug info
                console.log('=== Orientation Check ===');
                console.log('Required Orientation:', requiredOrientation, '(normalized:', normalizedRequired + ')');
                console.log('Window dimensions:', window.innerWidth, 'x', window.innerHeight);
                console.log('Is currently portrait:', isCurrentlyPortrait);
                
                var needsWarning = false;
                
                // Check if device orientation matches required orientation
                if (normalizedRequired === "portrait" && !isCurrentlyPortrait) {
                    // Game requires Portrait but device is in Landscape
                    needsWarning = true;
                    console.log('✗ Warning: Game needs Portrait, device is Landscape');
                } else if (normalizedRequired === "landscape" && isCurrentlyPortrait) {
                    // Game requires Landscape but device is in Portrait  
                    needsWarning = true;
                    console.log('✗ Warning: Game needs Landscape, device is Portrait');
                } else {
                    console.log('✓ Orientation is correct, no warning needed');
                }
                
                console.log('Show warning:', needsWarning);
                console.log('========================');
                
                if (needsWarning) {
                    orientationWarning.classList.add('show');
                    gameContainer.style.display = 'none';
                    if (orientationText) {
                        orientationText.textContent = getOrientationMessage(requiredOrientation, isCurrentlyPortrait);
                        // Set RTL for Arabic
                        if (currentLang === 'ar') {
                            orientationText.setAttribute('dir', 'rtl');
                        } else {
                            orientationText.removeAttribute('dir');
                        }
                    }
                } else {
                    // Orientation is correct, hide warning
                    orientationWarning.classList.remove('show');
                    gameContainer.style.display = 'block';
                }
            }

            // Global variable to store current orientation setting
            var currentOrientationSetting = null;

            function loadTemplateConfig() {
                var request = new XMLHttpRequest();
                request.open('GET', 'TemplateData/Orientation/template.json', true);
                request.onreadystatechange = function() {
                    if (request.readyState === 4) {
                        if (request.status === 200) {
                            try {
                                var config = JSON.parse(request.responseText);
                                console.log('Template config loaded:', config);
                                var orientationOption = config.customOptions.find(option => option.name === "orientation");
                                if (orientationOption) {
                                    currentOrientationSetting = orientationOption.default;
                                    console.log('Orientation setting from template:', currentOrientationSetting);
                                    checkOrientation(currentOrientationSetting);
                                } else {
                                    console.log('No orientation option found in template');
                                }
                            } catch (e) {
                                console.error('Error parsing template.json:', e);
                            }
                        } else {
                            console.error('Failed to load template.json:', request.status);
                            // Fallback: hide orientation warning if template fails to load
                            orientationWarning.classList.remove('show');
                            gameContainer.style.display = 'block';
                        }
                    }
                };
                request.send();
            }

            var lastIsPortrait = null;
            var resizeRaf = null;
            var bufferResizeTimer = null;

            function updateDrawingBuffer() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var cw = canvas.clientWidth  || window.innerWidth;
                var ch = canvas.clientHeight || window.innerHeight;
                var w = Math.max(1, Math.round(cw * dpr));
                var h = Math.max(1, Math.round(ch * dpr));
                if (canvas.width  !== w) canvas.width  = w;
                if (canvas.height !== h) canvas.height = h;
            }

            function handleResize() {
                resizeRaf = null;
                onResize();

                if (bufferResizeTimer) clearTimeout(bufferResizeTimer);
                bufferResizeTimer = setTimeout(function () {
                    bufferResizeTimer = null;
                    updateDrawingBuffer();
                }, 200);

                if (currentOrientationSetting) {
                    var isPortrait = window.innerHeight > window.innerWidth;
                    if (isPortrait !== lastIsPortrait) {
                        lastIsPortrait = isPortrait;
                        checkOrientation(currentOrientationSetting);
                    }
                }
            }

            function scheduleResize() {
                if (resizeRaf === null) {
                    resizeRaf = requestAnimationFrame(handleResize);
                }
            }

            updateDrawingBuffer();

            createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                canvas = instance.Module.canvas;
                myGameInstance = instance;
                onResize();
                updateDrawingBuffer();
            });

            window.addEventListener('resize', scheduleResize);

            window.addEventListener('orientationchange', function () {
                setTimeout(function () {
                    lastIsPortrait = null;
                    scheduleResize();
                }, 100);
            });

            loadTemplateConfig();
        </script>

    </div>
</body>

</html>
